<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
    body { margin: 0; }
    a { color: #7a1f1f; }
  </style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 62px 64px 44px; background: #f7f5f0; color: #1a1a19; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px;">

  <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 40px;">
    <div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 50px; font-weight: 700; line-height: 1.1;">Drei Vorfragen entscheiden, was geprüft wird</div>
    <div style="font-size: 24px; color: #6b6862;">grau heißt: musste nicht geprüft werden</div>
  </div>

  <div style="flex-grow: 1;">
    <svg viewBox="0 0 1792 840" style="width: 100%; height: 100%; display: block;" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, sans-serif">

      <!-- Wurzel -->
      <rect x="130" y="0" width="360" height="74" fill="#ffffff" stroke="#1a1a19" stroke-width="4"/>
      <text x="310" y="47" font-size="28" font-weight="600" fill="#1a1a19" text-anchor="middle">Preisanpassungsklausel</text>
      <g stroke="#1a1a19" stroke-width="4" fill="none"><path d="M 310 74 l 0 30"/></g>

      <!-- Vorfrage 1 -->
      <polygon points="310,104 430,164 310,224 190,164" fill="#ffffff" stroke="#1a1a19" stroke-width="4"/>
      <text x="310" y="158" font-size="25" font-weight="600" fill="#1a1a19" text-anchor="middle">§ 310 III</text>
      <text x="310" y="188" font-size="20" fill="#6b6862" text-anchor="middle">Verbraucher?</text>
      <g stroke="#9a968e" stroke-width="3" fill="none" stroke-dasharray="9 7"><path d="M 430 164 l 110 0"/></g>
      <rect x="540" y="128" width="420" height="72" fill="#efece4" stroke="#9a968e" stroke-width="3" stroke-dasharray="9 7"/>
      <text x="750" y="162" font-size="24" fill="#6b6862" text-anchor="middle">B2B, Energie, Wasser</text>
      <text x="750" y="188" font-size="21" fill="#9a968e" text-anchor="middle">anderes Regime — nicht dieser Baum</text>

      <!-- Vorfrage 2 -->
      <g stroke="#1a1a19" stroke-width="4" fill="none"><path d="M 310 224 l 0 38"/></g>
      <polygon points="310,262 430,322 310,382 190,322" fill="#ffffff" stroke="#1a1a19" stroke-width="4"/>
      <text x="310" y="314" font-size="22" font-weight="600" fill="#1a1a19" text-anchor="middle">überhaupt</text>
      <text x="310" y="344" font-size="22" font-weight="600" fill="#1a1a19" text-anchor="middle">erklärt?</text>
      <g stroke="#8c1c1c" stroke-width="4" fill="none"><path d="M 430 322 l 98 0"/><path d="M 518 314 l 12 8 -12 8"/></g>
      <rect x="540" y="286" width="420" height="72" fill="#f6e9e9" stroke="#8c1c1c" stroke-width="4"/>
      <text x="750" y="320" font-size="25" font-weight="600" fill="#8c1c1c" text-anchor="middle">§ 812 — ohne Rechtsgrund</text>
      <text x="750" y="346" font-size="21" fill="#8c1c1c" text-anchor="middle">der ganze Baum entfällt</text>

      <!-- Einbeziehung -->
      <g stroke="#1a1a19" stroke-width="4" fill="none"><path d="M 310 382 l 0 30"/></g>
      <rect x="140" y="412" width="340" height="70" fill="#ffffff" stroke="#1a1a19" stroke-width="3"/>
      <text x="310" y="456" font-size="27" font-weight="600" fill="#1a1a19" text-anchor="middle">Einbeziehung</text>
      <g stroke="#9a968e" stroke-width="2.5" fill="none">
        <path d="M 310 482 l 0 20"/><path d="M 200 502 L 420 502"/>
        <path d="M 200 502 l 0 20"/><path d="M 310 502 l 0 20"/><path d="M 420 502 l 0 20"/>
      </g>
      <g font-size="24" fill="#1a1a19" text-anchor="middle">
        <rect x="150" y="522" width="100" height="56" fill="#fff" stroke="#c9c4b8" stroke-width="2.5"/><text x="200" y="558">§ 305</text>
        <rect x="260" y="522" width="100" height="56" fill="#fff" stroke="#c9c4b8" stroke-width="2.5"/><text x="310" y="558">§ 305b</text>
        <rect x="370" y="522" width="100" height="56" fill="#fff" stroke="#c9c4b8" stroke-width="2.5"/><text x="420" y="558">§ 305c</text>
      </g>

      <!-- Vorfrage 3 -->
      <g stroke="#1a1a19" stroke-width="4" fill="none"><path d="M 310 578 l 0 30"/></g>
      <polygon points="310,608 430,668 310,728 190,668" fill="#ffffff" stroke="#1a1a19" stroke-width="4"/>
      <text x="310" y="662" font-size="24" font-weight="600" fill="#1a1a19" text-anchor="middle">§ 307 III</text>
      <text x="310" y="692" font-size="18" fill="#6b6862" text-anchor="middle">kontrollfähig?</text>
      <g stroke="#9a968e" stroke-width="3" fill="none" stroke-dasharray="9 7">
        <path d="M 190 668 l -60 0"/><path d="M 130 668 l 0 80"/>
      </g>
      <rect x="8" y="748" width="420" height="72" fill="#efece4" stroke="#9a968e" stroke-width="3" stroke-dasharray="9 7"/>
      <text x="218" y="782" font-size="24" fill="#6b6862" text-anchor="middle">nur der Ursprungspreis</text>
      <text x="218" y="808" font-size="21" fill="#9a968e" text-anchor="middle">Inhaltskontrolle entfällt</text>

      <!-- Weg in die Inhaltskontrolle -->
      <g stroke="#1a1a19" stroke-width="4" fill="none">
        <path d="M 430 668 l 130 0"/><path d="M 560 668 l 0 -198"/><path d="M 560 470 l 90 0"/>
        <path d="M 646 462 l 12 8 -12 8"/>
      </g>

      <!-- Inhaltskontrolle -->
      <rect x="660" y="380" width="1128" height="240" fill="#ffffff" stroke="#1a1a19" stroke-width="4"/>
      <text x="696" y="428" font-size="27" font-weight="600" fill="#1a1a19">Inhaltskontrolle — in dieser Reihenfolge</text>
      <rect x="696" y="442" width="240" height="76" fill="#f7f5f0" stroke="#1a1a19" stroke-width="4"/>
      <text x="816" y="492" font-size="34" font-weight="700" fill="#1a1a19" text-anchor="middle">§ 309</text>
      <text x="978" y="492" font-size="34" fill="#9a968e" text-anchor="middle">›</text>
      <rect x="1020" y="442" width="240" height="76" fill="#f7f5f0" stroke="#6b6862" stroke-width="3"/>
      <text x="1140" y="492" font-size="32" font-weight="600" fill="#1a1a19" text-anchor="middle">§ 308</text>
      <text x="1302" y="492" font-size="34" fill="#9a968e" text-anchor="middle">›</text>
      <rect x="1344" y="442" width="240" height="76" fill="#f7f5f0" stroke="#9a968e" stroke-width="2.5" stroke-dasharray="9 6"/>
      <text x="1464" y="492" font-size="30" fill="#6b6862" text-anchor="middle">§ 307</text>
      <g stroke="#8c1c1c" stroke-width="5">
        <path d="M 712 458 l 34 28"/><path d="M 746 458 l -34 28"/>
        <path d="M 1360 458 l 34 28"/><path d="M 1394 458 l -34 28"/>
      </g>
      <text x="696" y="556" font-size="22" fill="#3a3833">ohne Abwägung</text>
      <text x="1584" y="556" font-size="22" fill="#6b6862" text-anchor="end">mit Abwägung</text>
      <text x="696" y="598" font-size="22" fill="#8c1c1c">zwei Risse — beide festgehalten, keiner beendet die Prüfung</text>

      <!-- Ausübung -->
      <g stroke="#1a1a19" stroke-width="4" fill="none"><path d="M 1240 620 l 0 32"/></g>
      <rect x="1090" y="652" width="300" height="70" fill="#ffffff" stroke="#1a1a19" stroke-width="3"/>
      <text x="1240" y="696" font-size="27" font-weight="600" fill="#1a1a19" text-anchor="middle">Ausübung</text>
      <g stroke="#9a968e" stroke-width="2.5" fill="none">
        <path d="M 1240 722 l 0 18"/><path d="M 1180 740 L 1300 740"/>
        <path d="M 1180 740 l 0 18"/><path d="M 1300 740 l 0 18"/>
      </g>
      <rect x="1128" y="758" width="104" height="54" fill="#fff" stroke="#c9c4b8" stroke-width="2.5"/>
      <text x="1180" y="793" font-size="24" fill="#1a1a19" text-anchor="middle">§ 130</text>
      <rect x="1248" y="758" width="104" height="54" fill="#fdf7ea" stroke="#a4720a" stroke-width="4"/>
      <text x="1300" y="793" font-size="24" fill="#8a5f08" text-anchor="middle">§ 315</text>

      <!-- Zeichenerklärung -->
      <g transform="translate(1470, 740)">
        <polygon points="0,14 28,28 0,42 -28,28" fill="#ffffff" stroke="#1a1a19" stroke-width="3"/>
        <text x="44" y="36" font-size="22" fill="#3a3833">Vorfrage</text>
        <rect x="0" y="62" width="30" height="26" fill="#efece4" stroke="#9a968e" stroke-width="3" stroke-dasharray="6 5"/>
        <text x="44" y="84" font-size="22" fill="#3a3833">nicht geprüft</text>
      </g>
    </svg>
  </div>

  <div style="border-top: 2px solid #1a1a19; padding-top: 16px; font-size: 23px; color: #3a3833;">Was grau ist, hat niemand geprüft — und der Baum sagt, welche Vorfrage das entschieden hat.</div>
</div>
</x-dc>
</body>
</html>
