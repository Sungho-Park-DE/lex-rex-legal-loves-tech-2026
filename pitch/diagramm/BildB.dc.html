<!doctype html>
<html>

<body>
<x-dc>

      <text x="530" y="40" font-family="IBM Plex Sans, sans-serif" font-size="17" fill="#3a3833">die Klausel</text>

          <text x="762" y="112" font-size="16" fill="#6b6862">§ 310</text>

        <g>

          <line x1="185" y1="248" x2="815" y2="248" stroke="#1a1a19" stroke-width="2" stroke-dasharray="26 14"/>

          <text x="596" y="446" font-size="16" fill="#8a5f08">§ 130 · § 315</text>
        </g>
        <g>
          <rect x="290" y="510" width="420" height="66" fill="#efece4" stroke="#1a1a19" stroke-width="2"/>

    <span>Was durchfällt, ist wirksam.</span>
    <span>Der oberste Boden ist der schärfste: § 309 hält ohne jede Abwägung.</span>
  </div>
</div>
</x-dc>

</html>
