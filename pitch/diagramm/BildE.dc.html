<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
    body { margin: 0; }
    a { color: #7a1f1f; }
  </style>
</helmet>
<div style="width: 1200px; height: 800px; box-sizing: border-box; padding: 40px 44px; background: #f7f5f0; color: #1a1a19; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 12px;">

  <div style="display: flex; align-items: baseline; justify-content: space-between;">
    <div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 27px; font-weight: 700;">Drei Vorfragen entscheiden, was überhaupt geprüft wird</div>
    <div style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #6b6862;">E — Bedingter Baum</div>
  </div>

  <div style="flex-grow: 1;">
    <svg viewBox="0 0 1060 610" style="width: 100%; height: 100%;" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, sans-serif">

      <rect x="60" y="14" width="200" height="44" fill="#ffffff" stroke="#1a1a19" stroke-width="3"/>
      <text x="160" y="42" font-size="15" font-weight="600" fill="#1a1a19" text-anchor="middle">Preisanpassungsklausel</text>

      <g stroke="#1a1a19" stroke-width="2" fill="none"><path d="M 160 58 l 0 26"/></g>
      <polygon points="160,84 214,118 160,152 106,118" fill="#ffffff" stroke="#1a1a19" stroke-width="2"/>
      <text x="160" y="114" font-size="13" font-weight="600" fill="#1a1a19" text-anchor="middle">§ 310 III</text>
      <text x="160" y="132" font-size="12" fill="#6b6862" text-anchor="middle">Verbraucher?</text>

      <g stroke="#b7b2a8" stroke-width="2" fill="none" stroke-dasharray="6 5"><path d="M 214 118 l 92 0"/></g>
      <rect x="306" y="96" width="180" height="44" fill="#efece4" stroke="#b7b2a8" stroke-dasharray="6 5"/>
      <text x="396" y="115" font-size="13.5" fill="#9a968e" text-anchor="middle">Sonderregime, B2B</text>
      <text x="396" y="132" font-size="12.5" fill="#9a968e" text-anchor="middle">anderer Baum — nicht geprüft</text>

      <g stroke="#1a1a19" stroke-width="2" fill="none"><path d="M 160 152 l 0 28"/></g>
      <polygon points="160,180 214,214 160,248 106,214" fill="#ffffff" stroke="#1a1a19" stroke-width="2"/>
      <text x="160" y="210" font-size="12.5" font-weight="600" fill="#1a1a19" text-anchor="middle">überhaupt</text>
      <text x="160" y="227" font-size="12.5" font-weight="600" fill="#1a1a19" text-anchor="middle">erklärt?</text>

      <g stroke="#8c1c1c" stroke-width="2" fill="none"><path d="M 214 214 l 92 0"/><path d="M 300 208 l 8 6 -8 6"/></g>
      <rect x="306" y="192" width="180" height="44" fill="#f6e9e9" stroke="#8c1c1c" stroke-width="2"/>
      <text x="396" y="211" font-size="13.5" font-weight="600" fill="#8c1c1c" text-anchor="middle">§ 812 — ohne Rechtsgrund</text>
      <text x="396" y="228" font-size="12.5" fill="#8c1c1c" text-anchor="middle">der ganze Baum entfällt</text>

      <g stroke="#1a1a19" stroke-width="2" fill="none"><path d="M 160 248 l 0 26"/></g>
      <rect x="70" y="274" width="180" height="42" fill="#ffffff" stroke="#1a1a19" stroke-width="2"/>
      <text x="160" y="300" font-size="14.5" font-weight="600" fill="#1a1a19" text-anchor="middle">Einbeziehung</text>
      <g stroke="#b7b2a8" stroke-width="1.5" fill="none">
        <path d="M 160 316 l 0 18"/><path d="M 92 334 L 228 334"/>
        <path d="M 92 334 l 0 14"/><path d="M 160 334 l 0 14"/><path d="M 228 334 l 0 14"/>
      </g>
      <g font-size="13" fill="#3a3833" text-anchor="middle">
        <rect x="60" y="348" width="64" height="28" fill="#fff" stroke="#e2ded5"/><text x="92" y="367">§ 305</text>
        <rect x="128" y="348" width="64" height="28" fill="#fff" stroke="#e2ded5"/><text x="160" y="367">§ 305b</text>
        <rect x="196" y="348" width="64" height="28" fill="#fff" stroke="#e2ded5"/><text x="228" y="367">§ 305c</text>
      </g>

      <g stroke="#1a1a19" stroke-width="2" fill="none"><path d="M 160 376 l 0 26"/></g>
      <polygon points="160,402 218,436 160,470 102,436" fill="#ffffff" stroke="#1a1a19" stroke-width="2"/>
      <text x="160" y="432" font-size="12.5" font-weight="600" fill="#1a1a19" text-anchor="middle">§ 307 III</text>
      <text x="160" y="449" font-size="12" fill="#6b6862" text-anchor="middle">kontrollfähig?</text>

      <g stroke="#b7b2a8" stroke-width="2" fill="none" stroke-dasharray="6 5"><path d="M 218 436 l 88 0"/></g>
      <rect x="306" y="414" width="180" height="44" fill="#efece4" stroke="#b7b2a8" stroke-dasharray="6 5"/>
      <text x="396" y="433" font-size="13.5" fill="#9a968e" text-anchor="middle">nur der Ursprungspreis</text>
      <text x="396" y="450" font-size="12.5" fill="#9a968e" text-anchor="middle">Inhaltskontrolle entfällt</text>

      <g stroke="#1a1a19" stroke-width="2" fill="none"><path d="M 160 470 l 0 22"/><path d="M 160 492 l 400 0"/><path d="M 560 492 l 0 -34"/></g>

      <rect x="560" y="286" width="440" height="172" fill="#ffffff" stroke="#1a1a19" stroke-width="3"/>
      <text x="586" y="312" font-size="14.5" font-weight="600" fill="#1a1a19">Inhaltskontrolle — in dieser Reihenfolge</text>
      <rect x="586" y="330" width="112" height="42" fill="#f7f5f0" stroke="#1a1a19" stroke-width="2.5"/>
      <text x="642" y="357" font-size="17" font-weight="600" fill="#1a1a19" text-anchor="middle">§ 309</text>
      <text x="712" y="357" font-size="18" fill="#9a968e">›</text>
      <rect x="734" y="330" width="112" height="42" fill="#f7f5f0" stroke="#6b6862" stroke-width="1.8"/>
      <text x="790" y="357" font-size="16" fill="#1a1a19" text-anchor="middle">§ 308</text>
      <text x="860" y="357" font-size="18" fill="#9a968e">›</text>
      <rect x="882" y="330" width="96" height="42" fill="#f7f5f0" stroke="#9a968e" stroke-dasharray="6 4"/>
      <text x="930" y="357" font-size="15" fill="#6b6862" text-anchor="middle">§ 307</text>
      <text x="586" y="398" font-size="12.5" fill="#3a3833">ohne Abwägung</text>
      <text x="978" y="398" font-size="12.5" fill="#6b6862" text-anchor="end">mit Abwägung</text>
      <g stroke="#8c1c1c" stroke-width="3">
        <path d="M 633 342 l 18 16"/><path d="M 651 342 l -18 16"/>
        <path d="M 781 342 l 18 16"/><path d="M 799 342 l -18 16"/>
      </g>
      <text x="586" y="428" font-size="12.5" fill="#8c1c1c">zwei Risse — beide festgehalten, keiner beendet die Prüfung</text>

      <g stroke="#1a1a19" stroke-width="2" fill="none"><path d="M 780 458 l 0 26"/></g>
      <rect x="690" y="484" width="180" height="42" fill="#ffffff" stroke="#1a1a19" stroke-width="2"/>
      <text x="780" y="510" font-size="14.5" font-weight="600" fill="#1a1a19" text-anchor="middle">Ausübung</text>
      <g stroke="#b7b2a8" stroke-width="1.5" fill="none">
        <path d="M 780 526 l 0 16"/><path d="M 726 542 L 834 542"/>
        <path d="M 726 542 l 0 14"/><path d="M 834 542 l 0 14"/>
      </g>
      <rect x="694" y="556" width="64" height="28" fill="#fff" stroke="#e2ded5"/>
      <text x="726" y="575" font-size="13" fill="#3a3833" text-anchor="middle">§ 130</text>
      <rect x="802" y="556" width="64" height="28" fill="#fdf7ea" stroke="#a4720a" stroke-width="2"/>
      <text x="834" y="575" font-size="13" fill="#8a5f08" text-anchor="middle">§ 315</text>

      <g>
        <rect x="60" y="530" width="560" height="56" fill="#ffffff" stroke="#e2ded5"/>
        <polygon points="92,545 110,558 92,571 74,558" fill="#ffffff" stroke="#1a1a19" stroke-width="2"/>
        <text x="122" y="563" font-size="13.5" fill="#3a3833">Vorfrage</text>
        <rect x="196" y="548" width="22" height="20" fill="#efece4" stroke="#b7b2a8" stroke-dasharray="5 4"/>
        <text x="228" y="563" font-size="13.5" fill="#3a3833">nicht geprüft, weil ein Ast zu ist</text>
        <rect x="462" y="548" width="22" height="20" fill="#fdf7ea" stroke="#a4720a" stroke-width="2"/>
        <text x="494" y="563" font-size="13.5" fill="#3a3833">Mensch entscheidet</text>
      </g>
    </svg>
  </div>

  <div style="border-top: 1px solid #d8d3c8; padding-top: 9px; font-size: 12.5px; color: #6b6862;">Grau heißt nicht „in Ordnung", sondern „hier musste nicht geprüft werden" — und der Baum sagt, welche Vorfrage das entschieden hat.</div>
</div>
</x-dc>
</body>
</html>
