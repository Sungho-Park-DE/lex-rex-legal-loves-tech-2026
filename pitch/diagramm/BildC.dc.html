<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
    body { margin: 0; }
    a { color: #7a1f1f; }
  </style>
</helmet>
<div style="width: 1200px; height: 800px; box-sizing: border-box; padding: 40px 44px; background: #f7f5f0; color: #1a1a19; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px;">

  <div style="display: flex; align-items: baseline; justify-content: space-between;">
    <div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 27px; font-weight: 700;">Zuerst das schärfste Messer</div>
    <div style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #6b6862;">C — Rangfolge</div>
  </div>

  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center;">
    <svg viewBox="0 0 1000 580" style="width: 100%; height: 100%;" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, sans-serif">
      <line x1="92" y1="72" x2="92" y2="524" stroke="#d8d3c8" stroke-width="2"/>
      <text x="66" y="86" font-size="13" fill="#6b6862" text-anchor="end">fest</text>
      <text x="66" y="516" font-size="13" fill="#6b6862" text-anchor="end">Abwägung</text>

      <g>
        <rect x="120" y="60" width="330" height="96" fill="#ffffff" stroke="#1a1a19" stroke-width="3"/>
        <text x="146" y="104" font-size="30" font-weight="700" fill="#1a1a19">§ 309</text>
        <text x="146" y="132" font-size="14.5" fill="#3a3833">Verbot ohne Wertung</text>
      </g>
      <g>
        <rect x="190" y="188" width="330" height="90" fill="#ffffff" stroke="#6b6862" stroke-width="2"/>
        <text x="216" y="230" font-size="26" font-weight="600" fill="#1a1a19">§ 308</text>
        <text x="216" y="256" font-size="14.5" fill="#3a3833">Verbot mit Wertung</text>
      </g>
      <g>
        <rect x="260" y="310" width="330" height="84" fill="#ffffff" stroke="#9a968e" stroke-width="2" stroke-dasharray="7 5"/>
        <text x="286" y="350" font-size="23" font-weight="600" fill="#3a3833">§ 307</text>
        <text x="286" y="374" font-size="14.5" fill="#6b6862">Generalklausel</text>
      </g>
      <g>
        <rect x="330" y="424" width="330" height="80" fill="#fdf7ea" stroke="#a4720a" stroke-width="2"/>
        <text x="356" y="462" font-size="21" font-weight="600" fill="#8a5f08">§ 315</text>
        <text x="356" y="486" font-size="14.5" fill="#8a5f08">nur ein Mensch</text>
      </g>

      <g stroke="#1a1a19" stroke-width="2" fill="none">
        <path d="M 450 108 l 92 0"/>
        <path d="M 520 188 l 92 0" stroke="#6b6862"/>
        <path d="M 590 352 l 92 0" stroke="#9a968e"/>
      </g>
      <g font-size="15" fill="#3a3833">
        <text x="556" y="113">hält die Klausel nicht</text>
        <text x="626" y="193">hält sie nicht</text>
        <text x="696" y="357">bleibt die Abwägung</text>
      </g>

      <g>
        <rect x="700" y="60" width="230" height="96" fill="#f6e9e9" stroke="#8c1c1c" stroke-width="2"/>
        <text x="815" y="100" font-size="17" font-weight="600" fill="#8c1c1c" text-anchor="middle">unwirksam</text>
        <text x="815" y="126" font-size="14" fill="#8c1c1c" text-anchor="middle">ohne Abwägung</text>
      </g>

      <g stroke="#b7b2a8" stroke-width="1.5" fill="none" stroke-dasharray="4 5">
        <path d="M 120 60 l -28 -28"/>
      </g>
      <text x="120" y="26" font-size="14.5" fill="#6b6862">vorher: gilt AGB-Recht, ist die Klausel einbezogen?</text>
      <text x="330" y="548" font-size="14.5" fill="#6b6862">danach: Rechtsfolge — der alte Preis gilt weiter</text>
    </svg>
  </div>

  <div style="border-top: 1px solid #d8d3c8; padding-top: 10px; font-size: 12.5px; color: #6b6862;">Die Reihenfolge ist die Aussage: was ohne Abwägung feststeht, prüfen wir zuerst — das hält vor Gericht.</div>
</div>
</x-dc>
</body>
</html>
