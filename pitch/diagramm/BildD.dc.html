<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
    body { margin: 0; }
    a { color: #7a1f1f; }
  </style>
</helmet>
<div style="width: 1200px; height: 800px; box-sizing: border-box; padding: 40px 44px; background: #f7f5f0; color: #1a1a19; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 12px;">

  <div style="display: flex; align-items: baseline; justify-content: space-between;">
    <div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 27px; font-weight: 700;">Jeder Ast muss halten — und wir gehen alle</div>
    <div style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #6b6862;">D — Und-Baum</div>
  </div>

  <div style="flex-grow: 1;">
    <svg viewBox="0 0 1060 600" style="width: 100%; height: 100%;" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, sans-serif">

      <rect x="404" y="16" width="252" height="52" fill="#ffffff" stroke="#1a1a19" stroke-width="3"/>
      <text x="530" y="41" font-size="16" font-weight="600" fill="#1a1a19" text-anchor="middle">Preisanpassungsklausel</text>
      <text x="530" y="59" font-size="14" fill="#3a3833" text-anchor="middle">wirksam?</text>
      <circle cx="530" cy="88" r="15" fill="#f7f5f0" stroke="#1a1a19" stroke-width="2"/>
      <text x="530" y="93" font-size="13" font-weight="700" fill="#1a1a19" text-anchor="middle">UND</text>

      <g stroke="#1a1a19" stroke-width="2" fill="none">
        <path d="M 530 103 l 0 24"/>
        <path d="M 120 127 L 940 127"/>
        <path d="M 120 127 l 0 26"/><path d="M 325 127 l 0 26"/><path d="M 530 127 l 0 26"/>
        <path d="M 735 127 l 0 26"/><path d="M 940 127 l 0 26"/>
      </g>

      <g>
        <polygon points="120,153 148,181 120,209 92,181" fill="#ffffff" stroke="#1a1a19" stroke-width="2"/>
        <text x="120" y="186" font-size="13" fill="#1a1a19" text-anchor="middle">§ 310</text>
        <text x="120" y="232" font-size="14" fill="#3a3833" text-anchor="middle">Vorfrage</text>
        <text x="120" y="250" font-size="12.5" fill="#9a968e" text-anchor="middle">öffnet den Baum</text>
      </g>

      <g>
        <rect x="255" y="158" width="140" height="44" fill="#ffffff" stroke="#1a1a19" stroke-width="2"/>
        <text x="325" y="185" font-size="14.5" font-weight="600" fill="#1a1a19" text-anchor="middle">Einbeziehung</text>
        <g stroke="#b7b2a8" stroke-width="1.5" fill="none">
          <path d="M 325 202 l 0 20"/><path d="M 268 222 L 382 222"/>
          <path d="M 268 222 l 0 16"/><path d="M 325 222 l 0 16"/><path d="M 382 222 l 0 16"/>
        </g>
        <g font-size="13.5" fill="#3a3833" text-anchor="middle">
          <rect x="234" y="238" width="68" height="30" fill="#fff" stroke="#e2ded5"/><text x="268" y="258">§ 305</text>
          <rect x="291" y="238" width="68" height="30" fill="#fff" stroke="#e2ded5"/><text x="325" y="258">§ 305b</text>
          <rect x="348" y="238" width="68" height="30" fill="#fff" stroke="#e2ded5"/><text x="382" y="258">§ 305c</text>
        </g>
      </g>

      <g>
        <rect x="440" y="158" width="180" height="44" fill="#ffffff" stroke="#1a1a19" stroke-width="3"/>
        <text x="530" y="185" font-size="14.5" font-weight="600" fill="#1a1a19" text-anchor="middle">Inhaltskontrolle</text>
        <polygon points="530,214 552,236 530,258 508,236" fill="#ffffff" stroke="#1a1a19" stroke-width="2"/>
        <text x="530" y="241" font-size="11.5" fill="#1a1a19" text-anchor="middle">§ 307 III</text>
        <text x="596" y="241" font-size="12.5" fill="#9a968e">Vorfrage</text>
        <g stroke="#b7b2a8" stroke-width="1.5" fill="none">
          <path d="M 530 258 l 0 18"/><path d="M 450 276 L 610 276"/>
          <path d="M 450 276 l 0 16"/><path d="M 530 276 l 0 16"/><path d="M 610 276 l 0 16"/>
        </g>
        <rect x="414" y="292" width="72" height="34" fill="#fff" stroke="#1a1a19" stroke-width="2.5"/>
        <text x="450" y="314" font-size="15" font-weight="600" fill="#1a1a19" text-anchor="middle">§ 309</text>
        <rect x="494" y="292" width="72" height="34" fill="#fff" stroke="#6b6862" stroke-width="1.8"/>
        <text x="530" y="314" font-size="14.5" fill="#1a1a19" text-anchor="middle">§ 308</text>
        <rect x="574" y="292" width="72" height="34" fill="#fff" stroke="#9a968e" stroke-dasharray="6 4"/>
        <text x="610" y="314" font-size="14" fill="#6b6862" text-anchor="middle">§ 307</text>
        <path d="M 414 344 L 646 344" stroke="#1a1a19" stroke-width="1.5" fill="none"/>
        <path d="M 640 338 l 8 6 -8 6" stroke="#1a1a19" stroke-width="1.5" fill="none"/>
        <text x="414" y="364" font-size="12.5" fill="#3a3833">ohne Abwägung</text>
        <text x="646" y="364" font-size="12.5" fill="#6b6862" text-anchor="end">mit Abwägung</text>
      </g>

      <g>
        <rect x="665" y="158" width="140" height="44" fill="#ffffff" stroke="#1a1a19" stroke-width="2"/>
        <text x="735" y="185" font-size="14.5" font-weight="600" fill="#1a1a19" text-anchor="middle">Ausübung</text>
        <g stroke="#b7b2a8" stroke-width="1.5" fill="none">
          <path d="M 735 202 l 0 20"/><path d="M 700 222 L 770 222"/>
          <path d="M 700 222 l 0 16"/><path d="M 770 222 l 0 16"/>
        </g>
        <rect x="666" y="238" width="68" height="30" fill="#fff" stroke="#e2ded5"/>
        <text x="700" y="258" font-size="13.5" fill="#3a3833" text-anchor="middle">§ 130</text>
        <rect x="736" y="238" width="68" height="30" fill="#fdf7ea" stroke="#a4720a" stroke-width="2"/>
        <text x="770" y="258" font-size="13.5" fill="#8a5f08" text-anchor="middle">§ 315</text>
      </g>

      <g>
        <rect x="870" y="158" width="140" height="44" fill="#efece4" stroke="#1a1a19" stroke-width="2"/>
        <text x="940" y="185" font-size="14.5" font-weight="600" fill="#1a1a19" text-anchor="middle">Rechtsfolge</text>
        <g stroke="#b7b2a8" stroke-width="1.5" fill="none">
          <path d="M 940 202 l 0 20"/><path d="M 905 222 L 975 222"/>
          <path d="M 905 222 l 0 16"/><path d="M 975 222 l 0 16"/>
        </g>
        <rect x="871" y="238" width="68" height="30" fill="#fff" stroke="#e2ded5"/>
        <text x="905" y="258" font-size="13.5" fill="#3a3833" text-anchor="middle">§ 306</text>
        <rect x="941" y="238" width="68" height="30" fill="#fff" stroke="#e2ded5"/>
        <text x="975" y="258" font-size="13.5" fill="#3a3833" text-anchor="middle">§ 812</text>
      </g>

      <g stroke="#8c1c1c" stroke-width="3">
        <path d="M 316 250 l 18 18"/><path d="M 334 250 l -18 18"/>
        <path d="M 441 305 l 18 14"/><path d="M 459 305 l -18 14"/>
        <path d="M 521 305 l 18 14"/><path d="M 539 305 l -18 14"/>
      </g>

      <g>
        <rect x="120" y="470" width="820" height="76" fill="#ffffff" stroke="#e2ded5"/>
        <g stroke="#8c1c1c" stroke-width="3"><path d="M 150 498 l 14 14"/><path d="M 164 498 l -14 14"/></g>
        <text x="180" y="512" font-size="14" fill="#3a3833">gerissen — und trotzdem geht die Prüfung weiter</text>
        <rect x="512" y="492" width="26" height="22" fill="#fdf7ea" stroke="#a4720a" stroke-width="2"/>
        <text x="550" y="509" font-size="14" fill="#3a3833">hier entscheidet ein Mensch</text>
        <polygon points="800,491 818,509 800,527 782,509" fill="#ffffff" stroke="#1a1a19" stroke-width="2"/>
        <text x="828" y="514" font-size="14" fill="#3a3833">Vorfrage schließt den Ast</text>
      </g>
    </svg>
  </div>

  <div style="border-top: 1px solid #d8d3c8; padding-top: 9px; font-size: 12.5px; color: #6b6862;">Kein Entscheidungsbaum: es wird nicht ein Pfad gewählt, sondern jeder Ast geprüft — auch nach dem ersten Riss.</div>
</div>
</x-dc>
</body>
</html>
