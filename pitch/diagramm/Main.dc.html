<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
    body { margin: 0; }
    a { color: #7a1f1f; }
  </style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 62px 64px 44px; background: #f7f5f0; color: #1a1a19; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 26px;">

  <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 40px;">
    <div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 50px; font-weight: 700; line-height: 1.1;">Jeder Ast muss halten</div>
    <div style="font-size: 24px; color: #6b6862;">und wir gehen alle — auch nach dem ersten Riss</div>
  </div>

  <div style="flex-grow: 1;">
    <svg viewBox="0 0 1792 770" style="width: 100%; height: 100%; display: block;" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, sans-serif">

      <!-- Wurzel -->
      <rect x="696" y="0" width="400" height="80" fill="#ffffff" stroke="#1a1a19" stroke-width="4"/>
      <text x="896" y="52" font-size="32" font-weight="600" fill="#1a1a19" text-anchor="middle">Preisanpassungsklausel</text>
      <circle cx="896" cy="124" r="27" fill="#f7f5f0" stroke="#1a1a19" stroke-width="4"/>
      <text x="896" y="133" font-size="20" font-weight="700" fill="#1a1a19" text-anchor="middle">UND</text>

      <g stroke="#1a1a19" stroke-width="4" fill="none">
        <path d="M 896 80 l 0 17"/>
        <path d="M 896 151 l 0 31"/>
        <path d="M 150 182 L 1642 182"/>
        <path d="M 150 182 l 0 34"/><path d="M 523 182 l 0 34"/><path d="M 896 182 l 0 34"/>
        <path d="M 1269 182 l 0 34"/><path d="M 1642 182 l 0 34"/>
      </g>

      <!-- 1 Anwendungsbereich -->
      <g>
        <polygon points="150,216 260,272 150,328 40,272" fill="#ffffff" stroke="#1a1a19" stroke-width="4"/>
        <text x="150" y="268" font-size="26" font-weight="600" fill="#1a1a19" text-anchor="middle">§ 310</text>
        <text x="150" y="296" font-size="20" fill="#6b6862" text-anchor="middle">Vorfrage</text>
        <text x="150" y="382" font-size="24" fill="#3a3833" text-anchor="middle">Anwendungsbereich</text>
      </g>

      <!-- 2 Einbeziehung -->
      <g>
        <rect x="373" y="216" width="300" height="72" fill="#ffffff" stroke="#1a1a19" stroke-width="3"/>
        <text x="523" y="262" font-size="27" font-weight="600" fill="#1a1a19" text-anchor="middle">Einbeziehung</text>
        <g stroke="#9a968e" stroke-width="3" fill="none"><path d="M 523 288 l 0 18"/></g>
        <rect x="413" y="306" width="220" height="60" fill="#ffffff" stroke="#c9c4b8" stroke-width="2.5"/>
        <text x="523" y="346" font-size="26" fill="#1a1a19" text-anchor="middle">§ 305</text>
        <rect x="413" y="376" width="220" height="60" fill="#ffffff" stroke="#c9c4b8" stroke-width="2.5"/>
        <text x="523" y="416" font-size="26" fill="#1a1a19" text-anchor="middle">§ 305b</text>
        <rect x="413" y="446" width="220" height="60" fill="#ffffff" stroke="#c9c4b8" stroke-width="2.5"/>
        <text x="523" y="486" font-size="26" fill="#1a1a19" text-anchor="middle">§ 305c</text>
        <g stroke="#8c1c1c" stroke-width="5"><path d="M 429 392 l 34 28"/><path d="M 463 392 l -34 28"/></g>
      </g>

      <!-- 3 Inhaltskontrolle -->
      <g>
        <rect x="746" y="216" width="300" height="72" fill="#ffffff" stroke="#1a1a19" stroke-width="4"/>
        <text x="896" y="262" font-size="27" font-weight="600" fill="#1a1a19" text-anchor="middle">Inhaltskontrolle</text>
        <g stroke="#1a1a19" stroke-width="3" fill="none"><path d="M 896 288 l 0 12"/></g>
        <polygon points="896,298 1002,350 896,402 790,350" fill="#ffffff" stroke="#1a1a19" stroke-width="3"/>
        <text x="896" y="346" font-size="22" font-weight="600" fill="#1a1a19" text-anchor="middle">§ 307 III</text>
        <text x="896" y="372" font-size="18" fill="#6b6862" text-anchor="middle">Vorfrage</text>
        <g stroke="#9a968e" stroke-width="3" fill="none"><path d="M 896 400 l 0 18"/></g>

        <rect x="786" y="418" width="220" height="66" fill="#ffffff" stroke="#1a1a19" stroke-width="4"/>
        <text x="896" y="461" font-size="30" font-weight="700" fill="#1a1a19" text-anchor="middle">§ 309</text>
        <rect x="786" y="498" width="220" height="66" fill="#ffffff" stroke="#6b6862" stroke-width="3"/>
        <text x="896" y="541" font-size="28" font-weight="600" fill="#1a1a19" text-anchor="middle">§ 308</text>
        <rect x="786" y="578" width="220" height="66" fill="#ffffff" stroke="#9a968e" stroke-width="2.5" stroke-dasharray="9 6"/>
        <text x="896" y="621" font-size="26" fill="#6b6862" text-anchor="middle">§ 307</text>
        <g stroke="#8c1c1c" stroke-width="5">
          <path d="M 802 436 l 34 28"/><path d="M 836 436 l -34 28"/>
          <path d="M 802 596 l 34 28"/><path d="M 836 596 l -34 28"/>
        </g>
        <text x="896" y="686" font-size="22" fill="#6b6862" text-anchor="middle">ohne Abwägung → mit Abwägung</text>
      </g>

      <!-- 4 Ausübung -->
      <g>
        <rect x="1119" y="216" width="300" height="72" fill="#ffffff" stroke="#1a1a19" stroke-width="3"/>
        <text x="1269" y="262" font-size="27" font-weight="600" fill="#1a1a19" text-anchor="middle">Ausübung</text>
        <g stroke="#9a968e" stroke-width="3" fill="none"><path d="M 1269 288 l 0 18"/></g>
        <rect x="1159" y="306" width="220" height="60" fill="#ffffff" stroke="#c9c4b8" stroke-width="2.5"/>
        <text x="1269" y="346" font-size="26" fill="#1a1a19" text-anchor="middle">§ 130</text>
        <rect x="1159" y="376" width="220" height="60" fill="#fdf7ea" stroke="#a4720a" stroke-width="4"/>
        <text x="1269" y="416" font-size="26" fill="#8a5f08" text-anchor="middle">§ 315</text>
      </g>

      <!-- 5 Rechtsfolge -->
      <g>
        <rect x="1492" y="216" width="300" height="72" fill="#efece4" stroke="#1a1a19" stroke-width="3"/>
        <text x="1642" y="262" font-size="27" font-weight="600" fill="#1a1a19" text-anchor="middle">Rechtsfolge</text>
        <g stroke="#9a968e" stroke-width="3" fill="none"><path d="M 1642 288 l 0 18"/></g>
        <rect x="1532" y="306" width="220" height="60" fill="#ffffff" stroke="#c9c4b8" stroke-width="2.5"/>
        <text x="1642" y="346" font-size="26" fill="#1a1a19" text-anchor="middle">§ 306</text>
        <rect x="1532" y="376" width="220" height="60" fill="#ffffff" stroke="#c9c4b8" stroke-width="2.5"/>
        <text x="1642" y="416" font-size="26" fill="#1a1a19" text-anchor="middle">§ 812</text>
      </g>

      <!-- Zeichenerklärung -->
      <g transform="translate(60, 706)">
        <g stroke="#8c1c1c" stroke-width="5"><path d="M 0 6 l 26 22"/><path d="M 26 6 l -26 22"/></g>
        <text x="46" y="28" font-size="23" fill="#3a3833">gerissen — die Prüfung läuft weiter</text>
        <rect x="500" y="4" width="30" height="26" fill="#fdf7ea" stroke="#a4720a" stroke-width="4"/>
        <text x="546" y="28" font-size="23" fill="#3a3833">hier entscheidet ein Mensch</text>
        <polygon points="920,4 948,18 920,32 892,18" fill="#ffffff" stroke="#1a1a19" stroke-width="3"/>
        <text x="994" y="28" font-size="23" fill="#3a3833">Vorfrage — schließt einen Ast</text>
      </g>
    </svg>
  </div>

  <div style="border-top: 2px solid #1a1a19; padding-top: 16px; font-size: 23px; color: #3a3833;">Kein Entscheidungsbaum: es wird kein Pfad gewählt, sondern jeder Ast geprüft.</div>
</div>
</x-dc>
</body>
</html>
